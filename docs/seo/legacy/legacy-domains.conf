# Retired company domains azarhologram.co and azarhologram.ir.
# Every old URL gets a 301 to the closest page on azarhologram.net. The per-URL table
# (azarhologram-legacy-map.conf) is generated by docs/seo/legacy/redirect-map.js.
# Installed as sites-enabled/zz-legacy-domains so the main site keeps the default server.

map_hash_bucket_size 256;
map_hash_max_size 16384;

# "/about-us/", "/about-us.html" and "/about-us" are the same old page.
map $uri $legacy_norm {
    default $uri;
    "~^(?<legacy_p>/.*?)(?:\.html)?/*$" $legacy_p;
}

map $legacy_norm $legacy_known {
    default "";
    include /etc/nginx/azarhologram-legacy-map.conf;
}

map $legacy_norm $legacy_guess {
    default /;
    "~^/(tag|cat|category|blog|news|\d{4})(/|$)" /Blog;
    "~^/author(/|$)" /AboutUs;
}

map $legacy_known $legacy_dest {
    ""      $legacy_guess;
    default $legacy_known;
}

server {
    listen 80;
    listen [::]:80;
    server_name azarhologram.co www.azarhologram.co azarhologram.ir www.azarhologram.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://azarhologram.net$legacy_dest;
    }
}

# Self-signed until issue-certs.sh swaps in a Let's Encrypt certificate. Behind
# Cloudflare with SSL mode "Full", the self-signed one is enough for .co.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name azarhologram.co www.azarhologram.co;
    ssl_certificate /etc/nginx/ssl/legacy-selfsigned-azarhologram.co.pem;
    ssl_certificate_key /etc/nginx/ssl/legacy-selfsigned-azarhologram.co.key;
    return 301 https://azarhologram.net$legacy_dest;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name azarhologram.ir www.azarhologram.ir;
    ssl_certificate /etc/nginx/ssl/legacy-selfsigned-azarhologram.ir.pem;
    ssl_certificate_key /etc/nginx/ssl/legacy-selfsigned-azarhologram.ir.key;
    return 301 https://azarhologram.net$legacy_dest;
}
